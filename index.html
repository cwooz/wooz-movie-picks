<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wooz's Movie Picks</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2212%22%20fill=%22%2314150f%22/%3E%3Cg%3E%3Ccircle%20cx=%2232%22%20cy=%2232%22%20r=%2224%22%20fill=%22none%22%20stroke=%22%23d1a138%22%20stroke-width=%224%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2232%22%20r=%2219.5%22%20fill=%22%23d1a138%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2218.5%22%20r=%225.2%22%20fill=%22%2314150f%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2245.5%22%20r=%225.2%22%20fill=%22%2314150f%22/%3E%3Ccircle%20cx=%2218.5%22%20cy=%2232%22%20r=%225.2%22%20fill=%22%2314150f%22/%3E%3Ccircle%20cx=%2245.5%22%20cy=%2232%22%20r=%225.2%22%20fill=%22%2314150f%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2232%22%20r=%225.6%22%20fill=%22%2314150f%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2232%22%20r=%222.2%22%20fill=%22%23d1a138%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2212%22%20fill=%22%2314150f%22/%3E%3Cg%3E%3Ccircle%20cx=%2232%22%20cy=%2232%22%20r=%2224%22%20fill=%22none%22%20stroke=%22%23d1a138%22%20stroke-width=%224%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2232%22%20r=%2219.5%22%20fill=%22%23d1a138%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2218.5%22%20r=%225.2%22%20fill=%22%2314150f%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2245.5%22%20r=%225.2%22%20fill=%22%2314150f%22/%3E%3Ccircle%20cx=%2218.5%22%20cy=%2232%22%20r=%225.2%22%20fill=%22%2314150f%22/%3E%3Ccircle%20cx=%2245.5%22%20cy=%2232%22%20r=%225.2%22%20fill=%22%2314150f%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2232%22%20r=%225.6%22%20fill=%22%2314150f%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2232%22%20r=%222.2%22%20fill=%22%23d1a138%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0c0a;
    --bg-alt: #141510;
    --bg-raised: #1b1c16;
    --text: #e9e4d6;
    --text-dim: #8f8a78;
    --text-faint: #5c584c;
    --amber: #d1a138;
    --amber-bright: #e8bd54;
    --red: #a8382c;
    --rule: #2c2c25;
    --sprocket: #232319;
    --font-display: 'Oswald', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  /* scrollbar — WebKit/Blink gets the full treatment... */
  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-track {
    background: var(--bg-alt);
    border-left: 1px solid var(--rule);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--text-faint);
    border-radius: 2px;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--amber); }
  ::-webkit-scrollbar-thumb:active { background: var(--amber-bright); }
  ::-webkit-scrollbar-button { display: none; }

  /* ...Firefox gets the standard properties. Scoped so Chromium 121+, where
     scrollbar-color would otherwise override the rules above, keeps them. */
  @supports not selector(::-webkit-scrollbar) {
    html {
      scrollbar-width: thin;
      scrollbar-color: var(--text-faint) var(--bg-alt);
    }
  }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at top, rgba(209,161,56,0.05), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color: var(--text);
    font-family: var(--font-mono);
    -webkit-font-smoothing: antialiased;
    padding: 0 56px;
  }

  @media (max-width: 720px) {
    body { padding: 0 14px; }
  }

  /* sprocket rails */
  .rail {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 34px;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
    z-index: 0;
    pointer-events: none;
  }
  .rail.left { left: 10px; }
  .rail.right { right: 10px; }
  .rail .hole {
    width: 14px;
    height: 20px;
    background: var(--sprocket);
    border: 1px solid #050604;
    border-radius: 3px;
  }
  @media (max-width: 900px) {
    .rail { display: none; }
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* header / leader */
  header {
    padding: 90px 0 50px;
    text-align: center;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 10px;
  }

  .leader-mark {
    width: 84px;
    height: 84px;
    margin: 0 auto 28px;
    border-radius: 50%;
    border: 2px solid var(--amber);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .leader-mark::before,
  .leader-mark::after {
    content: "";
    position: absolute;
    background: var(--amber);
  }
  .leader-mark::before { width: 2px; height: 100%; opacity: .5; }
  .leader-mark::after { width: 100%; height: 2px; opacity: .5; }
  .leader-mark span {
    font-family: var(--font-display);
    font-size: 26px;
    color: var(--amber-bright);
    position: relative;
    background: var(--bg);
    padding: 2px 8px;
  }

  .kicker {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(38px, 7vw, 64px);
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0 0 12px;
    color: var(--text);
    line-height: 1;
  }
  h1 .poss {
    text-transform: lowercase;
  }

  h1 em {
    font-style: normal;
    color: var(--amber-bright);
  }

  .subhead {
    color: var(--text-dim);
    font-size: 14px;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.7;
  }

  .stamp {
    display: inline-block;
    margin-top: 26px;
    padding: 6px 14px;
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transform: rotate(-2deg);
    font-weight: 700;
  }

  /* add-a-film panel */
  .add-panel {
    padding: 22px 0;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 10px;
  }

  .add-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: var(--bg-raised);
    border: 1px solid var(--rule);
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 12px 16px;
    border-radius: 3px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .add-toggle:hover { color: var(--amber-bright); border-color: var(--amber); }
  .add-toggle:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .add-toggle-icon {
    font-family: var(--font-display);
    font-size: 15px;
    color: var(--amber);
    transition: transform .2s ease;
  }
  .add-toggle[aria-expanded="true"] .add-toggle-icon { transform: rotate(45deg); }

  .add-form {
    margin-top: 10px;
    padding: 20px 18px 18px;
    background: var(--bg-raised);
    border: 1px solid var(--rule);
    border-radius: 3px;
  }

  .add-grid {
    display: grid;
    grid-template-columns: 90px 1fr 1fr;
    gap: 14px 16px;
  }
  .add-field-title, .add-field-url { grid-column: 2 / 4; }

  @media (max-width: 640px) {
    .add-grid { grid-template-columns: 1fr 1fr; }
    .add-field-year { grid-column: 1 / 3; max-width: 120px; }
    .add-field-title, .add-field-url { grid-column: 1 / 3; }
  }

  .add-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .add-field span {
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .add-field input {
    background: var(--bg);
    border: 1px solid var(--rule);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 9px 10px;
    border-radius: 2px;
    outline: none;
    transition: border-color .15s ease;
  }
  .add-field input:focus { border-color: var(--amber); }
  .add-field input.invalid { border-color: var(--red); }

  .add-error {
    margin-top: 14px;
    font-size: 12px;
    color: var(--red);
    font-family: var(--font-mono);
  }

  .add-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 16px;
  }
  .add-submit, .add-download {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 2px;
    cursor: pointer;
    transition: opacity .15s ease;
  }
  .add-submit {
    background: var(--amber);
    color: #14150f;
    border: 1px solid var(--amber);
    font-weight: 700;
  }
  .add-submit:hover { opacity: 0.85; }
  .add-download {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--rule);
  }
  .add-download:hover { color: var(--amber-bright); border-color: var(--amber); }

  .add-toast {
    font-size: 12px;
    color: var(--amber-bright);
    font-family: var(--font-mono);
    margin-top: 10px;
  }

  /* search */
  .search-panel {
    padding: 26px 0 0;
  }

  .search-field {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-raised);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 0 12px;
    transition: border-color .15s ease;
  }
  .search-field:focus-within { border-color: var(--amber); }

  .search-icon {
    flex: none;
    width: 15px;
    height: 15px;
    fill: none;
    stroke: var(--text-faint);
    stroke-width: 2;
    stroke-linecap: round;
    transition: stroke .15s ease;
  }
  .search-field:focus-within .search-icon { stroke: var(--amber); }

  .search-field input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 11px 0;
  }
  .search-field input::placeholder { color: var(--text-faint); }
  .search-field input::-webkit-search-cancel-button {
    -webkit-appearance: none;
    appearance: none;
  }

  .search-clear {
    flex: none;
    background: transparent;
    border: 0;
    color: var(--text-faint);
    font-family: var(--font-display);
    font-size: 20px;
    line-height: 1;
    padding: 4px 2px;
    cursor: pointer;
    transition: color .15s ease;
  }
  .search-clear:hover { color: var(--amber-bright); }
  .search-clear:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .search-status {
    margin-top: 8px;
    min-height: 15px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .no-results {
    padding: 70px 0 40px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.9;
  }
  .no-results strong {
    display: block;
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 10px;
  }

  /* table of contents */
  nav.toc {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    justify-content: center;
    padding: 26px 0 40px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 10px;
  }
  nav.toc a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 4px 2px;
    border-bottom: 1px solid transparent;
    transition: color .15s ease, border-color .15s ease;
  }
  nav.toc a:hover { color: var(--amber-bright); border-color: var(--amber); }

  /* decade sections */
  .decade {
    padding: 56px 0 10px;
    scroll-margin-top: 24px;
  }

  .decade-head {
    display: flex;
    align-items: baseline;
    gap: 18px;
    margin-bottom: 6px;
  }

  .decade-num {
    font-family: var(--font-display);
    font-size: clamp(46px, 9vw, 78px);
    color: var(--amber);
    line-height: 0.8;
    font-weight: 700;
  }

  .decade-meta {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .decade-label {
    font-family: var(--font-display);
    font-size: 20px;
    letter-spacing: 0.08em;
    color: var(--text);
  }

  .decade-count {
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.08em;
  }

  .decade-rule {
    height: 1px;
    background: linear-gradient(90deg, var(--rule), transparent);
    margin: 18px 0 22px;
  }

  /* film ledger rows */

  .film {
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 18px;
    row-gap: 7px;
    align-items: baseline;
    padding: 18px 4px;
    border-bottom: 1px solid var(--rule);
    transition: background .15s ease, border-color .15s ease;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .film:hover { background: rgba(209,161,56,0.045); }
  .film:hover .film-title { color: var(--amber-bright); }
  .film:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .film-year {
    grid-column: 1;
    grid-row: 1;
    font-size: 16px;
    color: var(--amber);
    font-weight: 500;
    white-space: nowrap;
  }

  .film-title {
    grid-column: 2;
    grid-row: 1;
    font-family: var(--font-display);
    font-size: 24px;
    letter-spacing: 0.01em;
    color: var(--text);
    text-transform: uppercase;
    line-height: 1.2;
  }

  .film-meta {
    grid-column: 2;
    grid-row: 2;
    align-self: start;
    display: flex;
    flex-wrap: wrap;
    column-gap: 24px;
    row-gap: 4px;
  }

  .meta-item {
    font-size: 13.5px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .meta-label {
    color: var(--text-faint);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 11px;
    margin-right: 3px;
  }

  @media (max-width: 560px) {
    .film { column-gap: 12px; row-gap: 5px; }
    .film-year { font-size: 14px; }
    .film-title { font-size: 20px; }
    .meta-item { font-size: 12.5px; white-space: normal; }
  }

  footer {
    text-align: center;
    padding: 70px 0 90px;
    color: var(--text-faint);
    font-size: 11px;
    letter-spacing: 0.1em;
  }
  footer .end-mark {
    display: inline-block;
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.3em;
    margin-bottom: 10px;
    text-decoration: none;
    cursor: pointer;
    transition: color .15s ease;
  }
  footer .end-mark:hover { color: var(--amber-bright); }
  footer .end-mark:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

  ::selection { background: var(--amber); color: #14150f; }
</style>
</head>
<body id="top">

<div class="rail left" id="railLeft"></div>
<div class="rail right" id="railRight"></div>

<div class="wrap">

  <header>
    <div class="leader-mark"><span id="leaderCount">—</span></div>
    <div class="kicker">Curated &nbsp;•&nbsp; Practical Stunts &nbsp;•&nbsp; True Craftsmanship</div>
    <h1><em>Wooz<span class="poss">'s</span></em> Movie Picks</h1>
    <p class="subhead">Ten decades of films built on real sets, real stunts, and hands-on craftsmanship — long before digital shortcuts took over. Sorted by decade, then by year.</p>
    <div class="stamp">Wooz — Verified</div>
  </header>

  <section class="add-panel">
    <button type="button" class="add-toggle" id="addToggle" aria-expanded="false" aria-controls="addForm">
      <span class="add-toggle-icon">+</span> Add a Film to the Archive
    </button>
    <form class="add-form" id="addForm" hidden>
      <div class="add-grid">
        <label class="add-field add-field-year">
          <span>Year</span>
          <input type="text" id="fYear" inputmode="numeric" maxlength="4" placeholder="1975" autocomplete="off">
        </label>
        <label class="add-field add-field-title">
          <span>Title</span>
          <input type="text" id="fTitle" maxlength="120" placeholder="Jaws" autocomplete="off">
        </label>
        <label class="add-field">
          <span>Director</span>
          <input type="text" id="fDirector" maxlength="80" placeholder="Steven Spielberg" autocomplete="off">
        </label>
        <label class="add-field">
          <span>Starring</span>
          <input type="text" id="fActor" maxlength="80" placeholder="Richard Dreyfuss" autocomplete="off">
        </label>
        <label class="add-field add-field-url">
          <span>IMDb URL</span>
          <input type="text" id="fImdb" maxlength="200" placeholder="https://www.imdb.com/title/tt0073195/" autocomplete="off">
        </label>
      </div>
      <div class="add-error" id="addError" hidden></div>
      <div class="add-actions">
        <button type="submit" class="add-submit">Add Film</button>
        <button type="button" class="add-download" id="downloadBtn">Download Updated Page</button>
      </div>
    </form>
  </section>

  <section class="search-panel">
    <div class="search-field">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="10.5" cy="10.5" r="6.5"></circle>
        <line x1="15.4" y1="15.4" x2="21" y2="21"></line>
      </svg>
      <input type="search" id="searchInput" placeholder="Search by title, director, or actor&hellip;" autocomplete="off" spellcheck="false" aria-label="Search films by title, director, or actor">
      <button type="button" class="search-clear" id="searchClear" aria-label="Clear search" hidden>&times;</button>
    </div>
    <div class="search-status" id="searchStatus" role="status" aria-live="polite"></div>
  </section>

  <nav class="toc" id="toc"></nav>

  <main id="decades"></main>

  <footer>
    <a class="end-mark" href="#top">— END OF REEL —</a>
    <div id="filmCount"></div>
  </footer>

</div>

  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---- Search / filter state ----
  // Terms are matched against title, director, and starring — case- and
  // accent-insensitively, and every term must hit, so "mann heat" finds Heat.
  let filterQuery = '';

  function normalizeText(s) {
    return s.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
  }

  function filterTerms() {
    return normalizeText(filterQuery.trim()).split(/\s+/).filter(Boolean);
  }

  function matchesTerms(film, terms) {
    const hay = normalizeText([film[1], film[2], film[3] || ''].join(' '));
    return terms.every(t => hay.includes(t));
  }

  const tocEl = document.getElementById('toc');
  const decadesEl = document.getElementById('decades');
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');
  const searchStatus = document.getElementById('searchStatus');

  function renderAll() {
    tocEl.innerHTML = '';
    decadesEl.innerHTML = '';
    const terms = filterTerms();
    let totalFilms = 0;
    let shownFilms = 0;

    DATA.forEach((group) => {
      const id = slug(group.decade);
      totalFilms += group.films.length;

      // A decade with no matches drops out of both the ledger and the TOC.
      const films = terms.length ? group.films.filter(f => matchesTerms(f, terms)) : group.films;
      if (!films.length) return;
      shownFilms += films.length;

      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = group.decade;
      tocEl.appendChild(a);

      const section = document.createElement('section');
      section.className = 'decade';
      section.id = id;

      const shortNum = group.decade.match(/\d+/) ? group.decade.match(/\d+/)[0].slice(-2) : '—';

      section.innerHTML = `
        <div class="decade-head">
          <div class="decade-num">${shortNum}</div>
          <div class="decade-meta">
            <div class="decade-label">${group.decade}</div>
            <div class="decade-count">${films.length} FILM${films.length === 1 ? '' : 'S'}</div>
          </div>
        </div>
        <div class="decade-rule"></div>
        <div class="ledger">
          ${films.map(([year, title, director, actor, imdbId]) => `
            <a class="film" href="https://www.imdb.com/title/${imdbId}/" target="_blank" rel="noopener">
              <span class="film-year">${escapeHtml(year)}</span>
              <span class="film-title">${escapeHtml(title)}</span>
              <div class="film-meta">
                <span class="meta-item"><span class="meta-label">Director:</span> ${escapeHtml(director)}</span>
                <span class="meta-item"><span class="meta-label">Starring:</span> ${actor ? escapeHtml(actor) : '—'}</span>
              </div>
            </a>
          `).join('')}
        </div>
      `;
      decadesEl.appendChild(section);
    });

    if (terms.length && !shownFilms) {
      decadesEl.innerHTML = `
        <div class="no-results">
          <strong>No Matches</strong>
          Nothing in the archive matches &ldquo;${escapeHtml(filterQuery.trim())}&rdquo;.<br>
          Try a director, an actor, or part of a title.
        </div>
      `;
    }

    document.getElementById('filmCount').textContent = terms.length
      ? shownFilms + ' OF ' + totalFilms + ' TITLES SHOWN'
      : totalFilms + ' TITLES ON FILE';
    document.getElementById('leaderCount').textContent = terms.length ? shownFilms : totalFilms;

    // Driven from here so a freshly loaded page (including a downloaded copy,
    // which clones the live DOM) always starts in the unfiltered state.
    searchStatus.textContent = terms.length
      ? shownFilms + (shownFilms === 1 ? ' MATCH' : ' MATCHES')
      : '';
    searchClear.hidden = !filterQuery;
  }

  renderAll();

  // sprocket rails
  function buildRail(el) {
    const count = Math.ceil(window.innerHeight / 34) + 2;
    el.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const d = document.createElement('div');
      d.className = 'hole';
      el.appendChild(d);
    }
  }
  buildRail(document.getElementById('railLeft'));
  buildRail(document.getElementById('railRight'));
  window.addEventListener('resize', () => {
    buildRail(document.getElementById('railLeft'));
    buildRail(document.getElementById('railRight'));
  });

  // ---- Search ----
  function clearSearch(refocus) {
    searchInput.value = '';
    filterQuery = '';
    renderAll();
    if (refocus) searchInput.focus();
  }

  searchInput.addEventListener('input', () => {
    filterQuery = searchInput.value;
    renderAll();
  });

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && searchInput.value) {
      e.preventDefault();
      clearSearch(true);
    }
  });

  searchClear.addEventListener('click', () => clearSearch(true));

  // ---- Add-a-film panel ----
  const addToggle = document.getElementById('addToggle');
  const addForm = document.getElementById('addForm');
  const addError = document.getElementById('addError');

  addToggle.addEventListener('click', () => {
    const isOpen = addToggle.getAttribute('aria-expanded') === 'true';
    addToggle.setAttribute('aria-expanded', String(!isOpen));
    addForm.hidden = isOpen;
    if (!isOpen) document.getElementById('fYear').focus();
  });

  // Year field: digits only, max 4 chars, as you type
  const fYear = document.getElementById('fYear');
  fYear.addEventListener('input', () => {
    fYear.value = fYear.value.replace(/\D/g, '').slice(0, 4);
  });

  function showError(msg, fieldEl) {
    addError.textContent = msg;
    addError.hidden = false;
    document.querySelectorAll('.add-field input.invalid').forEach(el => el.classList.remove('invalid'));
    if (fieldEl) fieldEl.classList.add('invalid');
  }

  function clearError() {
    addError.hidden = true;
    addError.textContent = '';
    document.querySelectorAll('.add-field input.invalid').forEach(el => el.classList.remove('invalid'));
  }

  function decadeLabelForYear(year) {
    const start = Math.floor(year / 10) * 10;
    return start + "'s";
  }

  // Sort key: ignore a leading English article ("The", "A", "An")
  function sortTitle(t) {
    return t.replace(/^(the|a|an)\s+/i, '');
  }

  function addFilmToData(year, title, director, actor, imdbId) {
    const label = decadeLabelForYear(year);
    let group = DATA.find(g => g.decade === label);
    if (!group) {
      group = { decade: label, films: [] };
      DATA.push(group);
      DATA.sort((a, b) => parseInt(a.decade, 10) - parseInt(b.decade, 10));
    }
    group.films.push([String(year), title, director, actor, imdbId]);
    group.films.sort((a, b) =>
      parseInt(a[0], 10) - parseInt(b[0], 10) ||
      sortTitle(a[1]).localeCompare(sortTitle(b[1]), undefined, { sensitivity: 'base' })
    );
  }

  addForm.addEventListener('submit', (e) => {
    e.preventDefault();
    clearError();

    const fTitle = document.getElementById('fTitle');
    const fDirector = document.getElementById('fDirector');
    const fActor = document.getElementById('fActor');
    const fImdb = document.getElementById('fImdb');

    const year = fYear.value.trim();
    const title = fTitle.value.trim();
    const director = fDirector.value.trim();
    const actor = fActor.value.trim();
    const imdbUrl = fImdb.value.trim();

    if (!year || !title || !director || !actor || !imdbUrl) {
      showError('All fields are required.');
      return;
    }
    if (!/^\d{4}$/.test(year)) {
      showError('Year must be exactly 4 digits.', fYear);
      return;
    }
    const yearNum = parseInt(year, 10);
    const currentYear = new Date().getFullYear();
    if (yearNum < 1888 || yearNum > currentYear + 2) {
      showError(`Year should be between 1888 and ${currentYear + 2}.`, fYear);
      return;
    }
    const imdbMatch = imdbUrl.match(/tt\d{7,9}/);
    if (!imdbMatch) {
      showError('IMDb URL should look like https://www.imdb.com/title/tt1234567/', fImdb);
      return;
    }

    addFilmToData(yearNum, title, director, actor, imdbMatch[0]);
    // Drop any active filter, otherwise the new row lands in a hidden decade.
    clearSearch(false);

    addForm.reset();
    let toast = document.getElementById('addToast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'addToast';
      toast.className = 'add-toast';
      addForm.appendChild(toast);
    }
    toast.textContent = `Added "${title}" (${year}) — don't forget to download the updated page to keep it.`;
    setTimeout(() => { if (toast) toast.textContent = ''; }, 6000);
  });

  // ---- Download updated page ----
  document.getElementById('downloadBtn').addEventListener('click', () => {
    const doc = document.documentElement.cloneNode(true);
    const dataScript = Array.from(doc.querySelectorAll('script')).find(s => s.textContent.includes('const DATA = ['));
    if (dataScript) {
      dataScript.textContent = dataScript.textContent.replace(
        /const DATA = \[[\s\S]*?\n  \];/,
        'const DATA = ' + JSON.stringify(DATA, null, 2).replace(/\n/g, '\n  ') + ';'
      );
    }
    const html = '<!DOCTYPE html>\n' + doc.outerHTML;
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'index.html';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
