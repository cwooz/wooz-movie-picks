<style>
  :root {
    --bg: #0b0c0a;
    --bg-alt: #141510;
    --bg-raised: #1b1c16;
    --text: #e9e4d6;
    --text-dim: #8f8a78;
    --text-faint: #5c584c;
    --amber: #d1a138;
    --amber-bright: #e8bd54;
    --red: #a8382c;
    --rule: #2c2c25;
    --sprocket: #232319;
    --font-display: 'Oswald', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at top, rgba(209,161,56,0.05), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color: var(--text);
    font-family: var(--font-mono);
    -webkit-font-smoothing: antialiased;
    padding: 0 56px;
  }

  @media (max-width: 720px) {
    body { padding: 0 14px; }
  }

  /* sprocket rails */
  .rail {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 34px;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
    z-index: 0;
    pointer-events: none;
  }
  .rail.left { left: 10px; }
  .rail.right { right: 10px; }
  .rail .hole {
    width: 14px;
    height: 20px;
    background: var(--sprocket);
    border: 1px solid #050604;
    border-radius: 3px;
  }
  @media (max-width: 900px) {
    .rail { display: none; }
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* header / leader */
  header {
    padding: 90px 0 50px;
    text-align: center;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 10px;
  }

  .leader-mark {
    width: 84px;
    height: 84px;
    margin: 0 auto 28px;
    border-radius: 50%;
    border: 2px solid var(--amber);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .leader-mark::before,
  .leader-mark::after {
    content: "";
    position: absolute;
    background: var(--amber);
  }
  .leader-mark::before { width: 2px; height: 100%; opacity: .5; }
  .leader-mark::after { width: 100%; height: 2px; opacity: .5; }
  .leader-mark span {
    font-family: var(--font-display);
    font-size: 26px;
    color: var(--amber-bright);
    position: relative;
    background: var(--bg);
    padding: 2px 8px;
  }

  .kicker {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(38px, 7vw, 64px);
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0 0 12px;
    color: var(--text);
    line-height: 1;
  }
  h1 .poss {
    text-transform: lowercase;
  }

  h1 em {
    font-style: normal;
    color: var(--amber-bright);
  }

  .subhead {
    color: var(--text-dim);
    font-size: 14px;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.7;
  }

  .stamp {
    display: inline-block;
    margin-top: 26px;
    padding: 6px 14px;
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transform: rotate(-2deg);
    font-weight: 700;
  }

  /* table of contents */
  nav.toc {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    justify-content: center;
    padding: 26px 0 40px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 10px;
  }
  nav.toc a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 4px 2px;
    border-bottom: 1px solid transparent;
    transition: color .15s ease, border-color .15s ease;
  }
  nav.toc a:hover { color: var(--amber-bright); border-color: var(--amber); }

  /* decade sections */
  .decade {
    padding: 56px 0 10px;
    scroll-margin-top: 24px;
  }

  .decade-head {
    display: flex;
    align-items: baseline;
    gap: 18px;
    margin-bottom: 6px;
  }

  .decade-num {
    font-family: var(--font-display);
    font-size: clamp(46px, 9vw, 78px);
    color: var(--amber);
    line-height: 0.8;
    font-weight: 700;
  }

  .decade-meta {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .decade-label {
    font-family: var(--font-display);
    font-size: 20px;
    letter-spacing: 0.08em;
    color: var(--text);
  }

  .decade-count {
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.08em;
  }

  .decade-rule {
    height: 1px;
    background: linear-gradient(90deg, var(--rule), transparent);
    margin: 18px 0 22px;
  }

  /* film ledger rows */

  .film {
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 18px;
    row-gap: 7px;
    align-items: baseline;
    padding: 18px 4px;
    border-bottom: 1px solid var(--rule);
    transition: background .15s ease, border-color .15s ease;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .film:hover { background: rgba(209,161,56,0.045); }
  .film:hover .film-title { color: var(--amber-bright); }
  .film:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .film-year {
    grid-column: 1;
    grid-row: 1;
    font-size: 16px;
    color: var(--amber);
    font-weight: 500;
    white-space: nowrap;
  }

  .film-title {
    grid-column: 2;
    grid-row: 1;
    font-family: var(--font-display);
    font-size: 24px;
    letter-spacing: 0.01em;
    color: var(--text);
    text-transform: uppercase;
    line-height: 1.2;
  }

  .film-meta {
    grid-column: 2;
    grid-row: 2;
    align-self: start;
    display: flex;
    flex-wrap: wrap;
    column-gap: 24px;
    row-gap: 4px;
  }

  .meta-item {
    font-size: 13.5px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .meta-label {
    color: var(--text-faint);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 11px;
    margin-right: 3px;
  }

  @media (max-width: 560px) {
    .film { column-gap: 12px; row-gap: 5px; }
    .film-year { font-size: 14px; }
    .film-title { font-size: 20px; }
    .meta-item { font-size: 12.5px; white-space: normal; }
  }

  footer {
    text-align: center;
    padding: 70px 0 90px;
    color: var(--text-faint);
    font-size: 11px;
    letter-spacing: 0.1em;
  }
  footer .end-mark {
    display: inline-block;
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.3em;
    margin-bottom: 10px;
    text-decoration: none;
    cursor: pointer;
    transition: color .15s ease;
  }
  footer .end-mark:hover { color: var(--amber-bright); }
  footer .end-mark:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

  ::selection { background: var(--amber); color: #14150f; }
</style>
</head>

  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }

  const tocEl = document.getElementById('toc');
  const decadesEl = document.getElementById('decades');
  let totalFilms = 0;

  DATA.forEach((group, i) => {
    const id = slug(group.decade);
    totalFilms += group.films.length;

    const a = document.createElement('a');
    a.href = '#' + id;
    a.textContent = group.decade;
    tocEl.appendChild(a);

    const section = document.createElement('section');
    section.className = 'decade';
    section.id = id;

    const shortNum = group.decade.match(/\d+/) ? group.decade.match(/\d+/)[0].slice(-2) : '—';

    section.innerHTML = `
      <div class="decade-head">
        <div class="decade-num">${shortNum}</div>
        <div class="decade-meta">
          <div class="decade-label">${group.decade}</div>
          <div class="decade-count">${group.films.length} FILM${group.films.length === 1 ? '' : 'S'}</div>
        </div>
      </div>
      <div class="decade-rule"></div>
      <div class="ledger">
        ${group.films.map(([year, title, director, actor, imdbId]) => `
          <a class="film" href="https://www.imdb.com/title/${imdbId}/" target="_blank" rel="noopener">
            <span class="film-year">${year}</span>
            <span class="film-title">${title}</span>
            <div class="film-meta">
              <span class="meta-item"><span class="meta-label">Director:</span> ${director}</span>
              <span class="meta-item"><span class="meta-label">Starring:</span> ${actor || '—'}</span>
            </div>
          </a>
        `).join('')}
      </div>
    `;
    decadesEl.appendChild(section);
  });

  document.getElementById('filmCount').textContent = totalFilms + ' TITLES ON FILE';
  document.getElementById('leaderCount').textContent = totalFilms;

  // sprocket rails
  function buildRail(el) {
    const count = Math.ceil(window.innerHeight / 34) + 2;
    el.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const d = document.createElement('div');
      d.className = 'hole';
      el.appendChild(d);
    }
  }
  buildRail(document.getElementById('railLeft'));
  buildRail(document.getElementById('railRight'));
  window.addEventListener('resize', () => {
    buildRail(document.getElementById('railLeft'));
    buildRail(document.getElementById('railRight'));
  });
</script>
